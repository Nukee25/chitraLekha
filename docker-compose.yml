services:
  mongo:
    image: mongo:7
    container_name: chitra-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: /home/runner/work/chitraLekha/chitraLekha/backend
      dockerfile: Dockerfile
    container_name: chitra-backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: '*'
      MONGODB_URI: mongodb://mongo:27017/chitra_alerts
    ports:
      - '8000:8000'
    depends_on:
      - mongo

  frontend:
    build:
      context: /home/runner/work/chitraLekha/chitraLekha/frontend
      dockerfile: Dockerfile
    container_name: chitra-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1/chitra/alerts/
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  mongo_data:
